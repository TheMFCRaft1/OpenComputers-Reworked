sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

configurations {
    embedded
    implementation.extendsFrom embedded
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    accessTransformers = project.files('src/main/resources/oc_at.cfg')

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation "org.scala-lang:scala3-library_3:${scala_version}"
    implementation "com.typesafe:config:1.4.3"

    // Embed Scala into the mod module (dev + release) so ModuleClassLoader sees LazyVals$ etc.
    jarJar(implementation("org.scala-lang:scala3-library_3:${scala_version}")) {
        version {
            strictly "[${scala_version},)"
            prefer "${scala_version}"
        }
    }

    // Required for runClient/runServer on MC 1.21.8 and below (ModDevGradle)
    additionalRuntimeClasspath "org.scala-lang:scala3-library_3:${scala_version}"
    additionalRuntimeClasspath "com.typesafe:config:1.4.3"

    // Local Lua VM libraries (see libs/README.md)
    embedded files('libs/OC-LuaJ-20220907.1.jar')
    embedded files('libs/OC-JNLua-20230530.0.jar')
    embedded files('libs/OC-JNLua-Natives-20220928.1.jar')

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    def ocVersion = mod_version
    filesMatching('application.conf') {
        filter { line -> line.replaceAll('@VERSION@', ocVersion) }
    }
}

jar {
    from {
        configurations.embedded.collect { dep ->
            dep.isDirectory() ? dep : zipTree(dep)
        }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(ScalaCompile).configureEach {
    options.encoding = 'UTF-8'
    scalaCompileOptions.forkOptions.memoryMaximumSize = '2g'
    scalaCompileOptions.additionalParameters = [
        '-Wconf:cat=scala3-migration:s',
        '-rewrite',
        '-source:3.4-migration'
    ]
    dependsOn generateModMetadata
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
